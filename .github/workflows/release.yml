name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      HARNESS_NAME: wger-rs-release-${{ github.run_id }}
      HARNESS_PG_PORT: "55432"
      HARNESS_DJANGO_PORT: "8001"
      HARNESS_RUST_PORT: "8012"
      WGER_RS_BIN: ${{ github.workspace }}/target/release/wger-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run unit tests
        run: cargo test --locked --all-targets
      - name: Install contract harness dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Run contract harness
        run: harness/runtime/run-all.sh
      - name: Tear down harness
        if: always()
        run: harness/runtime/run-all.sh --down

  publish:
    name: Publish container and GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          sbom: true
          provenance: mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
