name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    # Dependency Review is enabled when the repository is public; private
    # repositories need an eligible GitHub Advanced Security plan.
    if: github.event.repository.private == false
    name: Review dependency changes
    runs-on: [self-hosted, Linux, X64, omarchibald, rust-builder-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
