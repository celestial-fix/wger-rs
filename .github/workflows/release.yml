name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: [self-hosted, heavenly]
    env:
      HARNESS_NAME: wger-rs-release-${{ github.run_id }}-${{ github.run_attempt }}
      WGER_RS_BIN: ${{ github.workspace }}/target/release/wger-rs
    steps:
      - uses: actions/checkout@v7
      - name: Allocate per-run loopback ports
        run: |
          python3 - >> "$GITHUB_ENV" <<PY
          import socket
          socks = []
          for name in ("HARNESS_PG_PORT", "HARNESS_DJANGO_PORT", "HARNESS_RUST_PORT"):
              s = socket.socket()
              s.bind(("127.0.0.1", 0))
              socks.append(s)
              print(f"{name}={s.getsockname()[1]}")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run unit tests
        run: cargo test --locked --all-targets
      - name: Install contract harness dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Run contract harness
        run: harness/runtime/run-all.sh
      - name: Tear down harness
        if: always()
        run: harness/runtime/run-all.sh --down

  publish:
    name: Publish container and GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          sbom: true
          provenance: mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
