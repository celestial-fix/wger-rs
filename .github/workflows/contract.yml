name: Contract

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    name: Django API compatibility
    runs-on: ubuntu-latest
    env:
      HARNESS_NAME: wger-rs-ci-${{ github.run_id }}
      HARNESS_PG_PORT: "55432"
      HARNESS_DJANGO_PORT: "8001"
      HARNESS_RUST_PORT: "8012"
      WGER_RS_BIN: ${{ github.workspace }}/target/release/wger-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Run disposable Django/Rust contract harness
        run: harness/runtime/run-all.sh
      - name: Tear down harness containers and generated test data
        if: always()
        run: harness/runtime/run-all.sh --down
