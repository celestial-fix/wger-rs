name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    # Runner selection via repo variable RUST_RUNNER (unset = omarchibald):
    #   omarchibald (default): all Rust jobs on [self-hosted, Linux, X64, omarchibald, rust-builder-x64]
    #   macmini: fmt/tests here on [self-hosted, macOS, ARM64, macmini, rust-builder];
    #            image build, contract harness, release validate (Linux images via Docker Desktop) on macmini too
    #   heavenly-vps: everything on [self-hosted, heavenly] (last resort)
    # Queued jobs never fail over, so flip it when omarchibald is offline:
    #   gh variable set RUST_RUNNER --body macmini -R heavenly-tech/wger-rs   (or heavenly-vps)
    #   gh variable delete RUST_RUNNER -R heavenly-tech/wger-rs               (back to omarchibald)
    runs-on: ${{ fromJSON('macmini' == 'heavenly-vps' && '["self-hosted","heavenly"]' || 'macmini' == 'macmini' && '["self-hosted","macOS","ARM64","macmini","rust-builder"]' || '["self-hosted","Linux","X64","omarchibald","rust-builder-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run unit tests
        run: cargo test --locked --all-targets

  image:
    name: Container image build
    needs: rust
    runs-on: ${{ fromJSON('macmini' == 'heavenly-vps' && '["self-hosted","heavenly"]' || 'macmini' == 'macmini' && '["self-hosted","macOS","ARM64","macmini","rust-builder"]' || '["self-hosted","Linux","X64","omarchibald","rust-builder-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          # image is x86_64 musl; built under emulation on macmini (ARM64)
          platforms: linux/amd64
          push: false
          load: true
          tags: wger-rs:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
