name: Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    name: Django API compatibility
    runs-on: [self-hosted, heavenly]
    env:
      HARNESS_NAME: wger-rs-ci-${{ github.run_id }}-${{ github.run_attempt }}
      WGER_RS_BIN: ${{ github.workspace }}/target/release/wger-rs
    steps:
      - uses: actions/checkout@v7
      - name: Allocate per-run loopback ports
        run: |
          python3 - >> "$GITHUB_ENV" <<PY
          import socket
          socks = []
          for name in ("HARNESS_PG_PORT", "HARNESS_DJANGO_PORT", "HARNESS_RUST_PORT"):
              s = socket.socket()
              s.bind(("127.0.0.1", 0))
              socks.append(s)
              print(f"{name}={s.getsockname()[1]}")
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Build Rust server
        run: cargo build --locked --release
      - name: Run disposable Django/Rust contract harness
        run: harness/runtime/run-all.sh
      - name: Tear down harness containers and generated test data
        if: always()
        run: harness/runtime/run-all.sh --down
