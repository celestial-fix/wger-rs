# Standalone API service. Bound to loopback for use behind a local reverse proxy.
# PowerSync fetches JWKS at http://web:8000/api/v2/powersync-keys, so this
# service keeps the `web` alias and listens on 8000 inside the network.
#
# The service also serves the Django static build and uploaded media itself, so
# the reverse proxy needs no file mounts. Mount the same volumes the wger
# deployment already uses.
services:
  web:
    build: ..
    image: wger-rs:local
    # The production compose file uses `user: "1000:1000"` so this service can
    # write to MEDIA_ROOT; the scratch image supports that (numeric UID/GID).
    user: "1000:1000"
    networks:
      default:
        aliases:
          - web
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BIND: 0.0.0.0:8000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an existing wger database}
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      STATIC_ROOT: /static
      MEDIA_ROOT: /media
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      POWERSYNC_URL: ${POWERSYNC_URL:-}
      POWERSYNC_URL_PATH: ps
    volumes:
      # Both mounts are read-only for serving. If media-file deletion (DELETE
      # of image records) is used, mount the media volume read-write instead
      # and make it writable by the container user.
      - wger-static:/static:ro
      - wger-media:/media:ro
    restart: unless-stopped

volumes:
  wger-static:
  wger-media:
