[package]
name = "wger-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "API-only Rust replacement for a self-hosted wger 2.7 server"
license = "AGPL-3.0-or-later"
repository = "https://github.com/heavenly-tech/wger-rs"
publish = false

[[bin]]
name = "wger-rs"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
hex = "0.4"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
mimalloc = "0.1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rand = "0.9"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "net", "time"] }
tower-http = { version = "0.7", features = ["trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
